# Veröffentlicht ausschließlich die gebaute Website aus neubau/dist auf GitHub Pages.
#
# Voraussetzung: Settings → Pages → Build and deployment → Source = "GitHub Actions".
# Ist dort noch "Deploy from a branch" eingestellt, bricht der Deploy-Job ab, damit
# nicht zwei Mechanismen um die Live-Seite konkurrieren.
#
# Der Workflow verändert das Repository nicht: keine Commits, keine Pushes,
# keine Textersetzungen im Quellcode.
#
# Veröffentlicht wird nur von main:
# - automatisch nach jedem Push auf main,
# - manuell (Run workflow) nur, wenn "Veröffentlichen" ausdrücklich angehakt ist.
#   Ohne Haken ist ein manueller Start ein Probelauf: Build und Prüfungen, keine Veröffentlichung.

name: Deploy MP Digital Labs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Veröffentlichen (nur auf main). Ohne Haken: Probelauf ohne Veröffentlichung."
        type: boolean
        default: false

# Standard: keine Rechte. Jeder Job erhält nur die Rechte, die er selbst braucht.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build (inkl. Link- und Bestands-URL-Prüfung)
        working-directory: neubau
        run: node scripts/build.mjs

      - name: Ausgabe prüfen (nur Website-Dateien)
        shell: bash
        run: |
          cd neubau/dist
          test -f index.html && test -f 404.html
          unexpected=$(find . -type f \( -name '*.mjs' -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' -o -name 'package.json' \) -print)
          if [ -n "$unexpected" ]; then
            echo "::error::Unerwartete Dateien in der Ausgabe:"; echo "$unexpected"; exit 1
          fi
          if grep -rqi 'formsubmit' --include='*.html' --include='*.js' .; then
            echo "::error::Ausgabe enthält noch FormSubmit-Verweise"; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: neubau/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      pages: write # Pages-Quelle lesen (GET /pages) und Deployment anlegen
      id-token: write # OIDC-Nachweis für deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages-Quelle prüfen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          echo "Pages build_type: ${build_type}"
          if [ "${build_type}" != "workflow" ]; then
            echo "::error::Pages-Quelle ist '${build_type}', erwartet 'workflow' (Settings → Pages → Source = GitHub Actions). Abbruch ohne Veröffentlichung."
            exit 1
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
