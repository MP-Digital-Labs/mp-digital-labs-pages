# VORLAGE – NICHT AKTIV.
# Dieser Workflow ersetzt bei Freigabe .github/workflows/pages.yml.
# Er baut den Neubau aus neubau/ und veröffentlicht ausschließlich neubau/dist
# auf GitHub Pages (Custom Domain über dist/CNAME).

name: Deploy MP Digital Labs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (inkl. Link- und Bestands-URL-Prüfung)
        working-directory: neubau
        run: node scripts/build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: neubau/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
